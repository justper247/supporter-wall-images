name: Render supporter wall

on:
  # Only ever started by the supporter-wall worker (its hourly cron, access-list changes,
  # and the dashboard's Refresh button), via the workflow_dispatch API.
  #
  # Deliberately NO schedule: trigger. GitHub disables scheduled workflows in public
  # repos after 60 days without a commit, and a disabled workflow also rejects the
  # worker's dispatches - so the wall images would silently freeze. GitHub's cron was
  # also too unreliable to be the clock (skipped and late runs).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race — this was the cause of the old
# "pages build and deployment" failure emails.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # Same image + font packages as the old Railway Dockerfile, so glyph
    # rendering (CJK, emoji, symbols) is byte-identical.
    container: node:24-bookworm-slim
    timeout-minutes: 15
    steps:
      - name: Install fonts
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            fonts-noto \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-noto-mono \
            fonts-noto-ui-core \
            fonts-noto-ui-extra \
            fonts-noto-unhinted \
            fonts-noto-color-emoji \
            fonts-symbola \
            fonts-tibetan-machine \
            fonts-sil-padauk \
            fontconfig \
            ca-certificates \
          && fc-cache -fv

      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm install --no-save --no-audit --no-fund "@napi-rs/canvas@^0.1.65"

      - name: Render PNGs
        run: node render.js

      # Publishes the VRChat world's supporter access list alongside the images.
      # VRChat won't fetch from workers.dev, so it has to be served from github.io.
      - name: Fetch supporter access list
        run: node fetch-access.js

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
